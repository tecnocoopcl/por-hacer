<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Aplicativo para gestionar una lista de tareas por hacer"
    />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Por hacer / Aplicación</title>
  </head>
  <body>
    <noscript>Necesitas habilitar JavaScript para usar esta aplicación.</noscript>
    <div id="root"></div>
    <script>
      // @inrupt/solid-client depende de cross-fetch, cuyo ponyfill exporta
      // window.fetch SIN enlazar (exports.fetch = ctx.fetch). En WebKit
      // (Safari) invocar ese fetch desligado lanza "TypeError: Can only call
      // Window.fetch on instances of Window". Se enlaza acá, antes de que se
      // evalúe cualquier módulo, para que cross-fetch capture ya la versión
      // enlazada.
      if (window.fetch) window.fetch = window.fetch.bind(window);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
